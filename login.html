<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card p-4 shadow" style="width: 350px;">
        <h4 class="text-center mb-4 text-primary">🏪 Đăng Nhập POS</h4>
        <input type="email" id="email" class="form-control mb-3" placeholder="Tài khoản Email">
        <input type="password" id="password" class="form-control mb-3" placeholder="Mật khẩu">
        <button class="btn btn-primary w-100 p-2 fw-bold" onclick="login()">ĐĂNG NHẬP</button>
        <p id="errorMsg" class="text-danger text-center mt-3 mb-0" style="display:none;">Sai tài khoản hoặc mật khẩu!</p>
    </div>
    <script type="module" src="login.js"></script>
</body>
</html>
