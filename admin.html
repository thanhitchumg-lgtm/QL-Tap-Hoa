<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị - POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-custom { background-color: #2b4b9b; color: white; }
        .stat-card { border-radius: 5px; padding: 20px; border-left: 4px solid; background: #fff; }
        .card-blue { border-color: #0d6efd; background-color: #f0f8ff; }
        .card-green { border-color: #198754; background-color: #f0fff4; }
        .card-yellow { border-color: #ffc107; background-color: #fffdf0; }
        .card-purple { border-color: #6f42c1; background-color: #f8f0ff; }
        .table-header { background-color: #cce5ff; font-weight: bold; }
    </style>
</head>
<body>

    <nav class="navbar navbar-custom px-3 py-2">
        <span class="navbar-brand mb-0 h1 text-white" style="font-size: 1.2rem;">🏪 Quản Trị</span>
        <div>
            <a href="index.html" class="btn btn-success btn-sm">🛒 Về Bán Hàng</a>
            <button class="btn btn-danger btn-sm ms-2" onclick="logout()">🚪 Thoát</button>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0">Báo Cáo Doanh Thu</h4>
            <button class="btn btn-primary" onclick="loadDashboard()">Làm Mới</button>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="stat-card card-blue">
                    <small class="text-muted">Doanh thu Hôm nay</small>
                    <h3 class="fw-bold text-primary my-2" id="todayRevenue">Đang tính...</h3>
                    <small class="text-muted" id="todayOrders">0 đơn</small>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card card-green">
                    <small class="text-muted">Lợi nhuận Hôm nay</small>
                    <h3 class="fw-bold text-success my-2" id="todayProfit">0 đ</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card card-yellow">
                    <small class="text-muted">Doanh thu Tháng này</small>
                    <h3 class="fw-bold text-warning my-2" id="monthRevenue">0 đ</h3>
                    <small class="text-muted" id="monthOrders">0 đơn</small>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card card-purple">
                    <small class="text-muted">Lợi nhuận Tháng này</small>
                    <h3 class="fw-bold text-purple my-2" id="monthProfit">0 đ</h3>
                </div>
            </div>
        </div>

        <h5 class="fw-bold mb-3">Đơn hàng gần nhất</h5>
        <div class="table-responsive bg-white border">
            <table class="table table-bordered table-hover mb-0">
                <thead>
                    <tr class="table-header text-center">
                        <th>Mã Đơn / Sản phẩm</th>
                        <th>SL</th>
                        <th>Giá bán</th>
                        <th>Tổng tiền</th>
                        <th>Lãi</th>
                    </tr>
                </thead>
                <tbody id="recentOrdersTable"></tbody>
            </table>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
