<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Tạp Hóa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-custom { background-color: #2b4b9b; color: white; }
        .product-card { cursor: pointer; transition: 0.2s; }
        .product-card:hover { border-color: #2b4b9b; box-shadow: 0 0 5px rgba(43,75,155,0.3); }
        .cart-container { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-pay { font-size: 1.2rem; font-weight: bold; }
        /* CSS cho in ấn và watermark hóa đơn */
/* Thiết lập Watermark & CSS In ấn */
      /* Watermark CHƯA LƯU và CSS In ấn */
        .watermark { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) rotate(-45deg); font-size: 3rem; color: rgba(255, 0, 0, 0.1); font-weight: bold; pointer-events: none; }
        @media print {
            body * { visibility: hidden; }
            .modal-backdrop, .modal-footer, .watermark { display: none !important; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; }
        }

    </style>
</head>
<body>

    <nav class="navbar navbar-custom px-3 py-2">
        <span class="navbar-brand mb-0 h1 text-white" style="font-size: 1.2rem;">🏪 POS Tạp Hóa</span>
        <div>
            <button class="btn btn-outline-light btn-sm" onclick="window.location.href='admin.html'">⚙️ Quản Trị</button>
            <button class="btn btn-danger btn-sm ms-2" onclick="logout()">🚪 Thoát</button>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        <div class="row">
            <div class="col-md-8">
                <input type="text" id="searchInput" class="form-control mb-3" placeholder="Gõ tên hoặc quét mã SP (Enter)..." autofocus>
                <div class="row row-cols-2 row-cols-md-4 g-3" id="productList"></div>
            </div>

            <div class="col-md-4">
                <div class="cart-container">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="text-primary mb-0 bg-primary text-white p-2 rounded w-100 d-flex justify-content-between align-items-center">
                            GIỎ HÀNG 
                            <button class="btn btn-danger btn-sm" onclick="clearCart()">Xóa Hết</button>
                        </h5>
                    </div>
                    
                    <input type="text" id="customerInfo" class="form-control mb-3" placeholder="Tên/SĐT Khách (Trống = Khách lẻ)">
                    <div id="cartList" class="mb-3" style="min-height: 150px; max-height: 250px; overflow-y: auto;"></div>
                    
                    <div class="d-flex justify-content-between fw-bold text-danger mb-2">
                        <span>Tổng tiền:</span>
                        <span id="totalPrice">0 đ</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="fw-bold">Khách đưa:</span>
                        <input type="number" id="customerPay" class="form-control form-control-sm w-50 text-end" oninput="calculateChange()">
                    </div>
                    <div class="d-flex justify-content-between fw-bold text-primary mb-3">
                        <span>Tiền thối:</span>
                        <span id="changeMoney">0 đ</span>
                    </div>

                    <button class="btn btn-success w-100 btn-pay p-3" onclick="checkout()">THANH TOÁN (F9)</button>
                </div>
            </div>
        </div>
    </div>
<!-- Khu vực ẩn chứa mẫu hóa đơn -->
    <div id="printArea"></div>

  <!-- Bảng Bill Nổi Lên (Modal) -->
    <div class="modal fade" id="billModal" data-bs-backdrop="static" tabindex="-1">
        <div class="modal-dialog modal-dialog-scrollable" style="max-width: 400px;">
            <div class="modal-content">
                <!-- Khu vực in hóa đơn -->
                <div class="modal-body" id="printArea" style="background: #fff; padding: 20px; font-family: 'Courier New', Courier, monospace; color: #000; position: relative;">
                    <div id="billContent"></div>
                </div>
                <!-- 3 Nút Bấm Chức Năng -->
                <div class="modal-footer d-flex justify-content-between p-2" style="background: #f1f1f1; border-top: 2px solid #ccc;">
                    <button class="btn text-white fw-bold" style="background-color: #6c757d; width: 32%;" onclick="processOrder('print')">IN HÓA ĐƠN</button>
                    <button class="btn btn-danger fw-bold" style="width: 32%;" data-bs-dismiss="modal">HỦY</button>
                    <button class="btn btn-success fw-bold" style="width: 32%;" onclick="processOrder('save')">XONG (LƯU)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script bắt buộc để bảng Bill hiển thị được -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
